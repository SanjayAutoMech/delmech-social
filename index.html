<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DelMech Engineering Solutions Pvt. Ltd.</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef7ff, #ffffff);
        min-height: 100vh;
        color: #082f55;
    }

    .container {
        max-width: 520px;
        margin: auto;
        padding: 35px 20px;
        text-align: center;
    }

    .logo {
        width: 110px;
        height: 110px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        font-size: 42px;
        font-weight: bold;
        color: #0b4f8a;
    }

    h1 {
        font-size: 25px;
        line-height: 1.25;
        margin-bottom: 8px;
    }

    .company {
        font-size: 15px;
        font-weight: 600;
        color: #50708c;
        margin-bottom: 8px;
    }

    .location {
        font-size: 13px;
        color: #71879a;
        margin-bottom: 28px;
    }

    .connect {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 18px;
    }

    .button {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        padding: 17px 20px;
        margin: 14px 0;
        border-radius: 15px;
        text-decoration: none;
        color: white;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 7px 18px rgba(0,0,0,0.12);
        transition: transform 0.2s;
    }

    .button:hover {
        transform: translateY(-2px);
    }

    .icon {
        width: 42px;
        height: 42px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
    }

    .text {
        text-align: left;
    }

    .small {
        display: block;
        font-size: 12px;
        font-weight: normal;
        margin-top: 3px;
        opacity: 0.9;
    }

    .whatsapp {
        background: #25D366;
    }

    .facebook {
        background: #1877F2;
    }

    .website {
        background: #0b5fa5;
    }

    .linkedin {
        background: #0A66C2;
    }

    footer {
        margin-top: 32px;
        font-size: 12px;
        color: #7890a5;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="container">

    <div class="logo">D</div>

    <h1>DelMech</h1>

    <div class="company">
        ENGINEERING SOLUTIONS PVT. LTD.
    </div>

    <div class="location">
        Dharwad | Karnataka | India
    </div>

    <div class="connect">
        Connect With Us
    </div>

    <!-- WhatsApp -->
    <a class="button whatsapp"
       href="https://wa.me/917259197766"
       target="_blank">
        <div class="icon">☏</div>
        <div class="text">
            WhatsApp
            <span class="small">Chat With Us</span>
        </div>
    </a>

    <!-- Facebook -->
    <a class="button facebook"
       href="https://www.facebook.com/people/DelMech-Engineering-Solutions-Pvt-Ltd/100063910158639/"
       target="_blank">
        <div class="icon">f</div>
        <div class="text">
            Facebook
            <span class="small">Follow Our Page</span>
        </div>
    </a>

    <!-- Website -->
    <a class="button website"
       href="https://www.delmech.in/"
       target="_blank">
        <div class="icon">🌐</div>
        <div class="text">
            Website
            <span class="small">Visit Our Website</span>
        </div>
    </a>

    <!-- LinkedIn -->
    <a class="button linkedin"
       href="https://www.linkedin.com/company/delmech-engineering-solutions-pvt-ltd/"
       target="_blank">
        <div class="icon">in</div>
        <div class="text">
            LinkedIn
            <span class="small">Connect With Us</span>
        </div>
    </a>

    <footer>
        © DelMech Engineering Solutions Pvt. Ltd.<br>
        HDPE Pipes | Fittings | Water Infrastructure Solutions
    </footer>

</div>

</body>
</html>
